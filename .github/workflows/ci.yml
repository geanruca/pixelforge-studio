name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pixelforge_studio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_sqlite, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --no-audit --no-fund
      - run: cp .env.example .env && php artisan key:generate

      # The pages are rendered by the feature tests, so the assets must exist.
      - run: npm run build

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan level 9, no baseline)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Lint, format and types (frontend)
        run: npm run check && npm run types:check

      - name: Tests on SQLite
        run: php artisan test

      # Row locks, savepoints and unique-violation handling behave differently
      # on PostgreSQL, which is what production runs.
      - name: Tests on PostgreSQL
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pixelforge_studio_test
          DB_USERNAME: test
          DB_PASSWORD: test
